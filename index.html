<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔王城 — 建造・散策プロトタイプ</title>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a14; --panel:#221a2e; --panel2:#2c2238; --line:#463658; --ink:#e9dfcd; --ink-dim:#a89bb5; --gold:#d9a441;
  --disp:'Shippori Mincho',serif; --body:'Noto Sans JP',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:15px}
.clock{display:flex;gap:10px;align-items:center;font-size:12px}
.clock-time{font-weight:700;color:var(--ink)}
.clock-phase{color:var(--gold);background:var(--panel2);border-radius:6px;padding:2px 8px;font-size:11px}
.clock-day{color:var(--ink-dim)}
.res{display:flex;gap:14px;font-size:13px;color:var(--ink-dim)}

#floors{flex:1;display:flex;flex-direction:column-reverse;overflow-y:auto;padding:10px;gap:6px}
.floor{position:relative;border-radius:10px;border:1px solid var(--line);height:104px;flex:none}
.floor.dim{opacity:.45;filter:grayscale(.4)}
.floor.locked{display:flex;align-items:center;justify-content:center;
  background:repeating-linear-gradient(135deg,#181022,#181022 10px,#150f1e 10px,#150f1e 20px);opacity:.6}
.locked-body{text-align:center}
.locked-icon{font-size:22px;opacity:.6}
.locked-text{font-size:10px;color:var(--ink-dim);margin:3px 0}
.locked-bar{width:160px;height:5px;background:#0d0a14;border-radius:3px;overflow:hidden;margin:0 auto}
.locked-bar i{display:block;height:100%;background:var(--gold)}
.floor-label{position:absolute;top:5px;left:8px;font-size:10px;color:var(--ink-dim);
  background:rgba(13,10,20,.75);padding:1px 7px;border-radius:7px;z-index:3}
.floor-scroll{position:relative;height:100%;overflow-x:auto;overflow-y:hidden;border-radius:10px;
  background-image:linear-gradient(#241b30,#1a1424 60%,#150f1e)}
.floor-track{position:relative;height:100%}
.floor.building-mode .floor-scroll{outline:2px solid rgba(217,164,65,.5);outline-offset:-2px}

.grid-overlay{position:absolute;inset:0;pointer-events:none;z-index:1}
.grid-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(217,164,65,.18)}
.placement-preview{position:absolute;top:20px;bottom:8px;border-radius:8px;z-index:2;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  border:2px dashed;pointer-events:none}
.placement-preview.ok{background:rgba(95,179,122,.18);border-color:#5fb37a;color:#bdf0cf}
.placement-preview.bad{background:rgba(214,76,76,.18);border-color:#d64c4c;color:#f5b8b8}

.stairs{position:absolute;bottom:0;top:0;display:flex;align-items:center;justify-content:center;
  font-size:20px;background:rgba(217,164,65,.08);border-left:1px dashed rgba(217,164,65,.4);
  border-right:1px dashed rgba(217,164,65,.4)}

.building{position:absolute;bottom:8px;top:20px;border-radius:8px;background:rgba(44,34,56,.75);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.fac-icon .art{width:28px;height:28px;display:block}
.fac-label{font-size:9px;color:var(--ink-dim);text-align:center;padding:0 2px}
.fac-sub{font-size:8px;color:var(--ink-dim)}
.sprite-sm svg{width:100%;height:100%}
.bubble{position:absolute;top:-12px;background:var(--gold);color:#1a1424;width:20px;height:20px;
  border-radius:50% 50% 50% 4px;display:flex;align-items:center;justify-content:center;font-size:10px;
  box-shadow:0 0 0 3px rgba(217,164,65,.25);animation:bob 1.6s ease-in-out infinite;z-index:3}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.npc{position:absolute;bottom:6px;text-align:center;width:36px;transform:translateX(-50%);transition:left .12s linear}
.npc.dimmed{opacity:.35}
.npc .art{width:26px;height:26px;display:block;margin:0 auto}
.npc-name{font-size:7px;color:var(--ink-dim);white-space:nowrap;background:rgba(13,10,20,.6);border-radius:6px;padding:0 3px}
.role-tag{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:8px;border-radius:4px;padding:0 3px;z-index:2}
.role-tag.staff{background:#5b8fd6;color:#0d0a14}
.role-tag.customer{background:var(--gold);color:#1a1424}
.role-tag.sleep{background:#4a4a5a;color:#dcd6e8}
.role-tag.prepare{background:#7a6a3a;color:#fff6d8}

.player{position:absolute;bottom:6px;text-align:center;width:44px;transform:translateX(-50%);z-index:4;transition:left .08s linear}
.player-body{width:34px;height:34px;border-radius:50%;background:#221a2e;border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;font-size:17px;margin:0 auto}
.player-name{font-size:8px;color:var(--gold);white-space:nowrap}

#controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:10px;background:var(--panel);border-top:1px solid var(--line);flex-wrap:wrap}
#controls button{border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);font-size:16px;cursor:pointer;width:48px;height:44px}
#controls button:active{background:var(--gold);color:#1a1424}
#controls .interact{background:#3a2c1a;border-color:var(--gold);color:var(--gold);font-weight:700;width:auto;padding:0 20px;font-size:13px}
#controls .debug{background:#2a1a1a;border-color:#8a4a4a;color:#e0a0a0;font-size:11px;width:auto;padding:0 10px}
#controls .logbtn{background:#1a2a3a;border-color:#4a7aa8;color:#a0c8e0;font-size:11px;width:auto;padding:0 10px}
#controls .floorbtn{background:#2a2a3a;border-color:#5a5a7a;color:#b8b8d8;font-size:12px;width:auto;padding:0 10px}
.hint-desktop{font-size:11px;color:var(--ink-dim);width:100%;text-align:center}

#overlay{position:fixed;inset:0;background:rgba(8,6,14,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;padding-bottom:120px}
#overlay.show{display:flex}
.panel{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:14px;width:92%;max-width:480px}
.panel-head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.panel-head-row .panel-head{margin-bottom:0}
.panel-head{font-family:var(--disp);color:var(--gold);font-size:14px;margin-bottom:8px}
.panel-head .mini{font-family:var(--body);color:var(--ink-dim);font-size:10px;font-weight:400}
.panel-body{font-size:13px;line-height:1.8}
.panel-hint{font-size:10px;color:var(--ink-dim);margin-top:8px;text-align:right}
.build-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.build-item{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:8px 4px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.build-item .art{width:28px;height:28px}
.build-item small{color:var(--ink-dim);font-size:9px}
.build-item.disabled{opacity:.4}

.panel.assign{max-height:64vh;overflow-y:auto}
.roster-col-label{font-size:11px;color:var(--gold);margin:10px 0 4px}
.roster-list{display:flex;flex-direction:column;gap:4px;max-height:140px;overflow-y:auto}
.roster-row{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:4px 8px;font-size:12px}
.roster-row .art{width:24px;height:24px;flex:none}
.roster-row span{flex:1}
.roster-row small{color:var(--ink-dim);font-size:10px;display:block}
.roster-empty{font-size:11px;color:var(--ink-dim);padding:6px 0}
.mini-btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:5px;
  padding:3px 8px;font-size:10px;cursor:pointer;flex:none}
.mini-btn.primary{background:#3a2c1a;border-color:var(--gold);color:var(--gold)}
.mini-btn.danger{background:#3a1a1a;border-color:#a85a5a;color:#e0a0a0}
.mini-btn[disabled]{opacity:.35;cursor:default}
.mini-tag{font-size:9px;color:var(--ink-dim);background:var(--panel);border-radius:5px;padding:3px 8px}
.mini-tag.regular{color:var(--gold);border:1px solid var(--gold);background:transparent}
.bond-tag{font-size:9px;color:#e0a8d8}
.panel-hint-note{font-size:10px;color:var(--ink-dim);margin-top:8px;line-height:1.5}
.chat-preview{background:var(--panel2);border-left:3px solid var(--gold);border-radius:6px;
  padding:8px 10px;margin-bottom:8px;font-size:12px}
.panel.history{max-height:64vh;overflow-y:auto}
.history-list{display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto}
.history-row{background:var(--panel2);border-left:2px solid var(--line);border-radius:4px;
  padding:6px 10px;font-size:12px;line-height:1.5}
.history-day{color:var(--gold);font-size:10px;margin-right:8px;font-weight:700}
.panel.logfeed{max-height:64vh;overflow-y:auto}
.log-list{display:flex;flex-direction:column;gap:5px;max-height:50vh;overflow-y:auto}
.log-row{background:var(--panel2);border-left:2px solid #4a7aa8;border-radius:4px;
  padding:6px 10px;font-size:12px;line-height:1.5}

#transferBanner{background:#3a2c1a;border-bottom:1px solid var(--gold);color:var(--gold);
  font-size:11px;padding:6px 16px;display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
#transferBanner:empty{display:none;padding:0;border:none}
.transfer-here{display:block;width:100%;margin-bottom:8px;text-align:center;font-size:12px;padding:8px}

#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(10px);background:#3a2c48;
  border:1px solid var(--gold);border-radius:8px;padding:8px 16px;opacity:0;transition:.2s;z-index:30;font-size:12px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#3a2c48;border-radius:3px}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <div id="transferBanner"></div>
  <main id="floors"></main>
  <div id="controls">
    <button onclick="btnFloor(1)" class="floorbtn">▲昇る</button>
    <button onclick="btnMove(-1)">◀</button>
    <button class="interact" onclick="btnInteract()">調べる</button>
    <button onclick="btnMove(1)">▶</button>
    <button onclick="btnFloor(-1)" class="floorbtn">▼降りる</button>
    <button class="debug" onclick="btnSkipHours(3)" title="動作確認用: 時間を3時間進める">+3h</button>
    <button class="logbtn" onclick="btnShowLog()" title="最近の出来事を見る">📰ログ</button>
    <span class="hint-desktop">← → で移動 / 🪜階段の上で ↑↓ 昇降 / Spaceでインタラクト</span>
  </div>
</div>
<div id="overlay"></div>
<div id="toast"></div>

<script src="src/art.js"></script>
<script src="src/data.js"></script>
<script src="src/art_species.js"></script>
<script src="src/sfx.js"></script>
<script src="src/game.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
